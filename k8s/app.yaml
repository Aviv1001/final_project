apiVersion: v1
kind: Namespace
metadata:
  name: lectures
---
# No storage class named on purpose, so this works on k3s, kind or minikube.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library
  namespace: lectures
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: lectures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # The volume belongs to this group, and nginx joins the same group,
      # so one pod can write the pages and the other can read them.
      securityContext:
        fsGroup: 10001
      # The script is process one and ignores the stop signal, so do not
      # wait the default thirty seconds for it.
      terminationGracePeriodSeconds: 5
      containers:
        - name: worker
          image: ghcr.io/aviv1001/lecture-worker:v1
          imagePullPolicy: IfNotPresent
          env:
            # Terraform picks the bucket name, so install.sh puts it here.
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: lecture-config
                  key: BUCKET
            - name: AWS_REGION
              value: eu-central-1
            - name: MODEL_ID
              value: eu.amazon.nova-micro-v1:0
            - name: LIBRARY
              value: /library
            # The script's own default is 60. On the demo machine I want faster.
            - name: POLL_INTERVAL
              value: "15"
          envFrom:
            - secretRef:
                name: aws-key
          volumeMounts:
            - name: library
              mountPath: /library
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: library
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lectures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: library
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: library
---
# One service on one machine, so it is published on a fixed port of the machine.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lectures
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
